name: Wilsdruff Kalender täglich aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: wilsdruff-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Kalender erzeugen
        run: python scraper.py
      - name: Kalender nur bei Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wilsdruff.ics
          if git diff --cached --quiet; then
            echo "Keine Änderungen an der ICS-Datei."
          else
            git commit -m "Update Wilsdruff calendar"
            git push
          fi

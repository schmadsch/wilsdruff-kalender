name: ICS-Export testen
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Wilsdruffer Termine in ICS umwandeln
        run: python scraper.py
      - name: ICS-Datei als Testartefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: wilsdruff-ics-test
          path: docs/wilsdruff.ics
          if-no-files-found: error
